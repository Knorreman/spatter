[package]
name = "spatter"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spatter: Spark-style RDDs as a Rust library (Design 1, same-binary)"
rust-version.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["rdd", "parallel", "distributed", "data-processing"]
categories = ["concurrency"]

[dependencies]
spatter-core.workspace = true
bincode = "1.3"
serde = { version = "1", features = ["derive"] }

[[example]]
name = "sum"
path = "examples/sum.rs"

[[example]]
name = "wordcount"
path = "examples/wordcount.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"
